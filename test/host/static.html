<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>player test, written as HTML</title>
    <!-- The package stylesheet as a plain link, so it applies with scripting
         off; test/features-test.mjs serves it at this address. -->
    <link rel="stylesheet" href="/flythrough.css" />
    <style>
      html, body { margin: 0; background: #111; color: #eee; font: 16px/1.5 system-ui, sans-serif; }
      .host { min-height: 150vh; padding: 2rem; box-sizing: border-box; background: #1d3323; }
    </style>
  </head>
  <body>
    <!-- The player as a site writes it, with a poster: for the checks that
         need the page before, or without, any script (static.ts adds the
         settings a query asks for, then loads the player). -->
    <div id="above"></div>
    <fly-through
      id="player"
      src="/tour/manifest.json"
      stops='[{"id":"entrance","at":0.0668,"label":"Entrance"},{"id":"lobby","at":0.1669,"label":"Lobby"},{"id":"overview","at":1,"label":"Overview"}]'
    >
      <img data-poster src="/tour/landscape/0049.webp" alt="" />
      <div data-stop="entrance">Card: Entrance</div>
      <div data-stop="lobby">Card: Lobby</div>
      <div data-stop="overview">Card: Overview</div>
      <p data-moment="stair" data-from="0.3" data-to="0.4">Passing the stairs</p>
    </fly-through>
    <section class="host" id="below"><h1>Host content below</h1></section>
    <script type="module" src="./static.ts"></script>
  </body>
</html>
